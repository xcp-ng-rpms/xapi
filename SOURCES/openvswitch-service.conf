[Unit]
Before=xapi.service
Before=xcp-networkd.service

[Service]
# xcp-networkd only brings up the bridges it creates: delete them on the first 
# start of openswitch.
ExecStartPost=/bin/sh -o pipefail -c '[ -e /run/openvswitch-bridges-cleared ] && exit 0; ovs-vsctl --no-wait list-br | xargs -r -n1 ovs-vsctl --no-wait del-br && touch /run/openvswitch-bridges-cleared'
